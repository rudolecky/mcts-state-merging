[project]
name = "mcts-phase0"
version = "0.1.0"
description = "Phase 0 value-geometry probe for the latent-MCTS state-merging plan"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "tqdm",
    "scikit-learn>=1.9.0",
    "pyperplan",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
markers = ["slow: requires downloading and loading the real model"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcts_phase0"]
